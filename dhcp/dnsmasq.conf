# DHCP e DNS per la LAN (parametri in mitm.conf, esempio 192.168.3.0/24, Mac .2):
#   DHCP: relay del router → Mac (LAN_IP):67 → pf rdr → questo container
#   DNS:  client → Mac (LAN_IP):53 → pf rdr → questo container
#
# Upstream DNS: quello di /etc/resolv.conf del container (192.168.64.1, il
# resolver del Mac esposto da vmnet), cioè gli stessi DNS che il Mac usa sulla
# sua rete. Segue da solo i cambi di rete (casa/ufficio), niente da configurare.

# Unico server DHCP della LAN: risponde subito anche a client con lease di altri server
dhcp-authoritative

# Parametri della LAN, generati da start-dhcp.sh da mitm.conf:
#   dhcp-range        range DHCP_FIRST–DHCP_LAST. La netmask è obbligatoria:
#                     per le reti servite via relay dnsmasq non può ricavarla.
#   option:router     Mac, così il traffico passa da pf (route-to verso mitmproxy)
#   option:dns-server Mac (rdr verso questo dnsmasq). Va indicato esplicitamente:
#                     altrimenti dnsmasq offrirebbe l'IP del container, non
#                     raggiungibile dai client.
#   dhcp-proxy        router: server-ID = indirizzo del relay, così anche i
#                     rinnovi (unicast al server-ID) passano dal router, invece
#                     di puntare all'IP del container che cambia
conf-file=/data/lan.conf

# Assegnazioni fisse (opzionale), una riga per device:
# dhcp-host=aa:bb:cc:dd:ee:ff,192.168.3.50

log-dhcp

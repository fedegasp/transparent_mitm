# DHCP per la LAN 192.168.3.0/24, raggiunto tramite il relay del router
# (192.168.3.1) → Mac 192.168.3.2:67 → pf rdr → questo container.

# Solo DHCP, niente DNS
port=0

# Unico server DHCP della LAN: risponde subito anche a client con lease di altri server
dhcp-authoritative

# Range fuori da .1 (router), .2 (Mac) e dagli IP statici in uso.
# La netmask è obbligatoria: per le reti servite via relay dnsmasq non può ricavarla.
dhcp-range=192.168.3.100,192.168.3.199,255.255.255.0,1h

# Gateway = Mac, così il traffico passa da pf (route-to verso mitmproxy)
dhcp-option=option:router,192.168.3.2
dhcp-option=option:dns-server,1.1.1.1,1.0.0.1,192.168.3.2

# Server-ID = indirizzo del relay: anche i rinnovi (unicast al server-ID)
# passano dal router, invece di puntare all'IP del container che cambia
dhcp-proxy=192.168.3.1

# Assegnazioni fisse (opzionale), una riga per device:
# dhcp-host=aa:bb:cc:dd:ee:ff,192.168.3.50

log-dhcp

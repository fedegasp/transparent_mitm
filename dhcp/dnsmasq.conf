# DHCP and DNS for the LAN (parameters in mitm.conf, e.g. 192.168.3.0/24, Mac .2):
#   DHCP: router relay → Mac (LAN_IP):67 → pf rdr → this container
#   DNS:  client → Mac (LAN_IP):53 → pf rdr → this container
#
# Upstream DNS: the one in the container's /etc/resolv.conf (192.168.64.1, the
# Mac's resolver exposed by vmnet), i.e. the same DNS servers the Mac uses on
# its network. Follows network changes (home/office) by itself, nothing to configure.

# Only DHCP server on the LAN: answers right away even clients with leases from other servers
dhcp-authoritative

# LAN parameters, generated by ./mitm start dhcp from mitm.conf:
#   dhcp-range        range DHCP_FIRST–DHCP_LAST. The netmask is mandatory:
#                     for networks served via relay dnsmasq cannot derive it.
#   option:router     Mac, so traffic goes through pf (route-to mitmproxy)
#   option:dns-server Mac (rdr to this dnsmasq). Must be set explicitly:
#                     otherwise dnsmasq would offer the container IP, which
#                     clients cannot reach.
#   dhcp-proxy        router: server-ID = relay address, so renewals too
#                     (unicast to the server-ID) go through the router, instead
#                     of pointing to the container IP, which changes
conf-file=/data/lan.conf

# Static assignments (optional), one line per device:
# dhcp-host=aa:bb:cc:dd:ee:ff,192.168.3.50

log-dhcp

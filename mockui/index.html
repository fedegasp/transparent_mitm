<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mock dashboard</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header>
  <h1>Mock dashboard</h1>
  <div id="switch" class="switch">
    <button id="switch-btn" type="button" aria-pressed="false">
      <span class="dot"></span><span id="switch-label">Mocks off</span>
    </button>
    <p id="switch-note" class="note"></p>
  </div>
</header>

<main>
  <section class="pane">
    <div class="pane-head">
      <h2>Mocks <span id="count" class="muted"></span></h2>
      <div class="form-actions">
        <button id="from-btn" type="button">From a request</button>
        <button id="new-btn" type="button" class="primary">+ New mock</button>
      </div>
    </div>
    <p class="note">The first enabled mock that matches wins, from the top down.</p>
    <div id="list"></div>
  </section>

  <section class="pane" id="editor-pane" hidden>
    <div id="editor"></div>
  </section>
</main>

<div id="picker" class="overlay" hidden>
  <section class="pane picker">
    <div class="pane-head">
      <h2>Requests <span id="picker-count" class="muted"></span></h2>
      <div class="form-actions">
        <button id="picker-refresh" type="button" title="Reload the list" aria-label="Reload">⟳</button>
        <button id="picker-close" type="button" title="Close" aria-label="Close">✕</button>
      </div>
    </div>
    <p class="note">mitmproxy's current history. The chosen request fills the form of a new mock: nothing is saved until you press ✓.</p>
    <input id="picker-filter" type="text" placeholder="Filter: method, host, path">
    <div id="picker-list"></div>
  </section>
</div>

<p id="error" class="error" hidden></p>

<script src="/app.js"></script>
</body>
</html>

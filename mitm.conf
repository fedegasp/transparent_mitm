# Configurazione della LAN servita dal Mac. Unico file da adattare per un
# altro Mac o un'altra rete: interfacce e subnet dei container sono ricavate
# da sole (WAN = rotta di default, LAN = interfaccia con LAN_IP, bridge dei
# container dal loro IP).
#
# Letto da ./mitm start dhcp (configurazione di dnsmasq) e dal daemon di root
# com.mitm.pf, che ne usa una copia: dopo una modifica, ./mitm install
# Formato: KEY=valore, senza spazi; il file non viene eseguito.

# IP statico del Mac sull'interfaccia LAN, con prefisso. È gateway e DNS dei
# client, e il server a cui il router inoltra il DHCP (relay).
LAN_IP=192.168.3.2/24

# Router della LAN, configurato come DHCP relay verso LAN_IP
ROUTER_IP=192.168.3.1

# Indirizzi assegnati ai client: fuori da router, Mac e IP statici in uso
DHCP_FIRST=192.168.3.100
DHCP_LAST=192.168.3.199

# Durata del lease: una modifica di gateway/DNS arriva ai client entro metà
DHCP_LEASE=1h

# Configuration of the LAN served by the Mac. The only file to adapt for
# another Mac or another network: interfaces and container subnet are derived
# automatically (WAN = default route, LAN = interface with LAN_IP, container
# bridge from their IP).
#
# Read by ./mitm start dhcp (dnsmasq configuration) and by the root daemon
# com.mitm.pf, which uses a copy of it: after a change, ./mitm install
# Format: KEY=value, no spaces; the file is never executed.

# Static IP of the Mac on the LAN interface, with prefix. It is the gateway and
# DNS of the clients, and the server the router forwards DHCP to (relay).
LAN_IP=192.168.3.2/24

# LAN router, configured as DHCP relay to LAN_IP
ROUTER_IP=192.168.3.1

# Addresses assigned to clients: outside router, Mac and static IPs in use
DHCP_FIRST=192.168.3.100
DHCP_LAST=192.168.3.199

# Lease time: a gateway/DNS change reaches clients within half of it
DHCP_LEASE=1h

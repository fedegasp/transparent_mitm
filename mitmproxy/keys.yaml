- key: "z"
  ctx: ["flowlist"]
  cmd: view.flows.remove !~marked
  help: Remove not marked flows
- key: P
  ctx: ["flowlist", "flowview"]
  cmd: pin.marked
- key: U
  ctx: ["flowlist", "flowview"]
  cmd: pin.unpin
- key: M
  ctx: ["flowlist", "flowview"]
  cmd: mock.dashboard
  help: Mock dashboard in the browser on the Mac
